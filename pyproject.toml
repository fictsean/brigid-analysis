[project]
name = "brigid-analysis"
version = "0.1.0"
description = "Climate attribution models for polluter liability analysis"
requires-python = ">=3.12"
dependencies = [
    # Notebooks
    "jupyterlab>=4.0",
    "ipykernel>=6.0",
    "ipywidgets>=8.0",
    # Data
    "pandas>=2.0",
    "numpy>=1.26",
    "openpyxl>=3.1",       # read EM-DAT Excel exports
    # Climate data
    "xarray>=2024.0",
    "netCDF4>=1.6",        # read ERA5 / CMIP6 .nc files
    "cdsapi>=0.7",         # Copernicus CDS API (ERA5 downloads)
    "intake-esm>=2023.0",  # CMIP6 catalog access via pangeo
    "zarr>=2.0",           # zarr store access for pangeo CMIP6
    "fsspec>=2024.0",      # cloud filesystem (pangeo)
    "gcsfs>=2024.0",       # Google Cloud Storage (pangeo CMIP6 bucket)
    # Geospatial
    "geopandas>=0.14",
    "shapely>=2.0",
    # Visualisation
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "plotly>=5.0",
    # Stats / ML
    "scipy>=1.12",
    "statsmodels>=0.14",
    "scikit-learn>=1.4",
    # Utilities
    "tqdm>=4.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "fair>=2.2.4",
]

[dependency-groups]
dev = [
    "nbstripout>=0.7",     # strip notebook outputs before committing
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
